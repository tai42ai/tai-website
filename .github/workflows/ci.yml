name: ci

# Type-checks and builds the static Astro site on every pull request.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22" # Node 22 LTS
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check (astro check)
        run: npx astro check
      - name: Build
        run: npm run build
