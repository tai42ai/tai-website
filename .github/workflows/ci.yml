name: ci

# Type-checks and builds the static Astro site on every pull request.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22" # Node 22 LTS
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check (astro check)
        run: npx astro check
      - name: Changelog stub guard
        # Every tracked CHANGELOG.md must be byte-identical to the canonical stub.
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          cat > "$expected" <<'STUB'
          # Changelog

          All notable changes to this project will be documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          ## [Unreleased]
          STUB
          found=0
          status=0
          while IFS= read -r -d '' f; do
            found=1
            if ! cmp -s "$f" "$expected"; then
              echo "Not byte-identical to the canonical stub: $f" >&2
              status=1
            fi
          done < <(git ls-files -z -- '**/CHANGELOG.md' 'CHANGELOG.md')
          if [ "$found" -eq 0 ]; then
            echo "No tracked CHANGELOG.md found" >&2
            exit 1
          fi
          exit "$status"
      - name: Build
        run: npm run build
